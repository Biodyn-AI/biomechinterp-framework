name: nmi-mechanistic-interpretability
channels:
  - conda-forge
  - bioconda
  - pytorch
dependencies:
  # Core Python
  - python>=3.8,<3.11
  
  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # Single-cell analysis (conda versions)
  - scanpy>=1.9.0
  - anndata>=0.8.0
  - h5py>=3.0.0
  
  # Deep learning
  - pytorch>=1.12.0
  - pytorch-cuda=11.7  # Adjust CUDA version as needed
  - transformers>=4.20.0
  
  # Statistical analysis
  - statsmodels>=0.13.0
  - networkx>=2.6.0
  
  # Plotting
  - plotly>=5.0.0
  
  # Utilities
  - requests>=2.25.0
  - tqdm>=4.60.0
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  
  # R dependencies for some analyses (optional)
  - r-base>=4.0
  - r-essentials
  
  # Pip dependencies that are not available via conda
  - pip
  - pip:
    - scvi-tools>=0.15.0
    - geneformer
    - shapley>=0.1.0
    - captum>=0.4.0
    - mapie>=0.4.0
    - pingouin>=0.5.0
    - lifelines>=0.26.0
    - pyro-ppl>=1.8.0
    - python-igraph>=0.9.0